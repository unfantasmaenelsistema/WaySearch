name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Constructor de consultas
        run: node tests/query.test.js
      - name: Sintaxis de los scripts
        run: for f in js/*.js; do node --check "$f"; done
